<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
<title id="title">Jake's Proper Thinking AI — implemented system architecture</title>
<desc id="desc">Four interfaces share a Python BookManager backend. PDFs are parsed to SQLite, local SentenceTransformer embeddings are stored in Chroma, and LangChain reasoning calls OpenRouter. Frameworks become documents, audits and mindmaps. Local worker processes persist progress to SQLite.</desc>
