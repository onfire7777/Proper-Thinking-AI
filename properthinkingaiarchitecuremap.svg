<text x="60" y="1092" class="label">04 / RESULTS AND DISTRIBUTION</text>
<rect x="60" y="1113" width="1480" height="108" class="box"/>
<text x="82" y="1150" class="head">Definitive document + quality audits + graph + answers with source excerpts</text>
<text x="82" y="1183" class="body">Nine document sections · PDF / DOCX · Qt WebEngine + vis-network mindmap · API / MCP / CLI views</text>
<text x="82" y="1208" class="small">Windows distribution: separate PyInstaller desktop and MCP builds with Torch / Qt runtime hooks</text>
<text x="60" y="1260" class="small">Architecture notes: interfaces can run as separate processes sharing a data root. Governor findings do not block saving.</text>
<text x="60" y="1288" class="small">Static source inspection, not runtime certification. Detailed call flows, schema, loop rules and source links are in the companion atlas.</text>
